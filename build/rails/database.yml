# Installed over the generated config/database.yml by bin/setup.
#
# `rails new` produces a file that works on a laptop and fails in a container,
# in two specific ways this file exists to fix:
#
#   1. Production hardcoded `username: app` and read a bespoke
#      APP_DATABASE_PASSWORD, ignoring DB_HOST entirely -- so the container
#      looked for a local MySQL socket that does not exist inside it. Every
#      environment now inherits DB_USER, DB_PASSWORD and DB_HOST from the
#      default block, which are the names the deployment writes into .env from
#      Secrets Manager.
#
#   2. The database was named after the framework (app_development), not after
#      the project. On a shared development server -- one MySQL for every
#      checkout -- "app_development" says nothing about whose it is, and the
#      second project to arrive collides with the first.
#
# The host is deliberately NOT a secret and NOT in .env.tpl: "db" is the
# container name on the shared network, and development overrides it in
# docker-compose.yml.
default: &default
  adapter: mysql2
  encoding: utf8mb4
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DB_USER") { "__APP_NAME__" } %>
  password: <%= ENV["DB_PASSWORD"] %>
  host: <%= ENV.fetch("DB_HOST") { "db" } %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") { "__APP_NAME__" } %>_development

# Erased and regenerated by the test tasks -- never point this at development
# or production.
test:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") { "__APP_NAME__" } %>_test

# One database. Rails 8 generates four -- primary, cache, queue and cable --
# for solid_cache, solid_queue and solid_cable. The generator runs with
# --skip-solid (see bin/init-rails) because this app caches in Redis, which
# runs beside MySQL in both environments and is shared with every other app
# here. The other three databases would have been created and migrated on
# every deploy, on a MySQL server shared with every other project, without
# ever being read.
#
# If this app grows a job queue, the choice is solid_queue (add the gem, add a
# queue entry here and a db:migrate:queue line to deploy/hooks.sh) or a Redis
# worker. Add the database with the feature, not before.
production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_NAME") { "__APP_NAME__" } %>
